site_name: Radixor
site_description: Learned transformation stemming with interoperable Java, Python, and Python-C runtimes
site_url: https://leogalambos.github.io/Radixor/
repo_url: https://github.com/leogalambos/Radixor
repo_name: leogalambos/Radixor
copyright: "© 2026 Egothor · Radixor software is BSD-3-Clause licensed."

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/images/radixor-logo.png
  favicon: assets/images/radixor-logo.png
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue

extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/landing-v2.css
  - assets/stylesheets/radixor-docs-safety.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md

  - Get Started:
     - Choose a Runtime: getting-started.md
     - Why Radixor Is Different: why-radixor-is-different.md
     - Java in 5 Minutes: fast-track.md
     - Python in 5 Minutes: python/fast-track.md
     - Python-C in 5 Minutes: python-c/quick-start.md

  - Evaluate Radixor:
     - Results Overview: benchmarks/index.md
     - How to Read the Evidence: benchmarking.md
     - Model Behavior and Generalization:
        - Multilingual Generalization: benchmarks/generalization.md
        - Edit-Cost Sensitivity: benchmarks/edit-cost-sensitivity.md
        - English Coverage and Speed: benchmarks/reference/english-coverage.md
     - Python Runtime Performance: python/performance.md
     - Language Comparisons:
        - Overview: benchmarks/languages/index.md
        - Czech: benchmarks/languages/czech.md
        - Danish: benchmarks/languages/danish.md
        - Dutch: benchmarks/languages/dutch.md
        - English: benchmarks/languages/english.md
        - Finnish: benchmarks/languages/finnish.md
        - French: benchmarks/languages/french.md
