tasks.register('verifyCoreJarExcludesModels') {
    group = 'verification'
    description = 'Verifies that the root Radixor JAR contains no language dictionary bytes.'
    dependsOn(tasks.named('jar'))
    doLast {
        File archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        List<String> dictionaries = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry -> if (entry.name.endsWith('/stemmer.gz')) dictionaries.add(entry.name) }
        }
        if (!dictionaries.isEmpty()) {
            throw new GradleException('The org.egothor:radixor JAR must not contain model data: ' + dictionaries)
        }
    }
}

tasks.register('verifyJavaLicenseHeaders') {
    group = 'verification'
    description = 'Verifies deterministic license classification for every maintained Java source file.'
    inputs.file(layout.projectDirectory.file('gradle/java-license-header.txt'))
    inputs.files(fileTree('src/main/java') { include '**/*.java' })
    inputs.files(fileTree('src/test/java') { include '**/*.java' })
    inputs.files(fileTree('src/jmh/java') { include '**/*.java' })
    outputs.file(layout.buildDirectory.file('reports/license/java-license-headers.txt'))
    doLast {
        String canonicalHeader = layout.projectDirectory.file('gradle/java-license-header.txt')
                .asFile.getText('UTF-8')
        File canonicalSource = file('src/main/java/org/egothor/stemmer/CaseProcessingMode.java')
        if (!canonicalSource.getText('UTF-8').startsWith(canonicalHeader)) {
            throw new GradleException('CaseProcessingMode.java does not begin with the canonical Radixor license template.')
        }

        List<File> maintainedSources = files(
                fileTree('src/main/java') { include '**/*.java' },
                fileTree('src/test/java') { include '**/*.java' },
                fileTree('src/jmh/java') { include '**/*.java' })
                .files.toList().sort { File left, File right ->
                    relativePath(left) <=> relativePath(right)
                }
        List<String> classifications = []
        List<String> failures = []
        maintainedSources.each { File sourceFile ->
            String relative = relativePath(sourceFile)
            String content = sourceFile.getText('UTF-8')
            if (content.startsWith(canonicalHeader)) {
                classifications.add("RADIXOR_CANONICAL_HEADER ${relative}")
                return
            }

            String leadingNotice = ''
            if (content.startsWith('/*')) {
                int closingIndex = content.indexOf('*/')
                if (closingIndex >= 0) {
                    leadingNotice = content.substring(0, closingIndex + 2)
                }
            } else if (content.startsWith('//')) {
                leadingNotice = content.readLines().takeWhile { String line ->
                    line.startsWith('//') || line.isBlank()
                }.join('\n')
            }
            String remainder = content.substring(leadingNotice.length()).stripLeading()
            boolean duplicateNotice = !leadingNotice.isEmpty()
                    && (remainder.startsWith('/*') || remainder.startsWith('//'))
            boolean historicalRadixor = leadingNotice =~ /(?s)Copyright \(C\) \d{4}(?:-\d{4})?, Leo Galambos/
                    && leadingNotice.contains('All rights reserved.')
                    && leadingNotice.contains('Redistribution and use in source and binary forms')
                    && leadingNotice.contains('THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS')
            boolean thirdPartyOrProvenance = leadingNotice =~ /(?is)(SPDX-License-Identifier|Licensed under|MIT License|Apache License|Permission is hereby granted|Original source|Adapted from|Ported from|Source:\s*\S)/
            if (duplicateNotice) {
                classifications.add("AMBIGUOUS_AUTHORSHIP ${relative}")
                failures.add("${relative}: duplicate leading comment blocks")
            } else if (historicalRadixor) {
                classifications.add("RADIXOR_HISTORICAL_HEADER ${relative}")
            } else if (thirdPartyOrProvenance) {
                classifications.add("THIRD_PARTY_OR_PROVENANCE_HEADER ${relative}")
            } else {
                classifications.add("AMBIGUOUS_AUTHORSHIP ${relative}")
                failures.add("${relative}: no recognized governing license or provenance header")
            }
        }

        File report = layout.buildDirectory.file('reports/license/java-license-headers.txt').get().asFile
        report.parentFile.mkdirs()
        report.setText(classifications.join('\n') + '\n', 'UTF-8')
        if (!failures.isEmpty()) {
            throw new GradleException('Maintained Java license verification failed: '
                    + failures.sort().join(', '))
        }
    }
}

tasks.register('verifySoftwareLicenseHeaders') {
    group = 'verification'
    description = 'Verifies canonical BSD-3-Clause headers on maintained non-Java software sources.'
    dependsOn(tasks.named('verifyJavaLicenseHeaders'))
    inputs.files(
            layout.projectDirectory.file('gradle/java-license-header.txt'),
            layout.projectDirectory.file('gradle/hash-license-header.txt'),
            layout.projectDirectory.file('gradle/slash-license-header.txt'),
            layout.projectDirectory.file('gradle/html-license-header.txt'),
            layout.projectDirectory.file('gradle/jinja-license-header.txt'))
    inputs.files(
            fileTree('.') { include '*.gradle' },
            fileTree('build-logic') { include '*.gradle', 'src/**/*.groovy' },
            fileTree('gradle') { include '*.gradle' },
            fileTree('models') { include '*/build.gradle' },
            fileTree('python-c/src') { include '**/*.c', '**/*.h' },
            fileTree('docs/assets') { include '**/*.css', '**/*.js' },
            fileTree('experiments') { include '**/*.java' },
            fileTree('python') {
                include '**/*.py'
                exclude '**/build/**', '**/__pycache__/**', '**/*.egg-info/**'
            },
            fileTree('python-c') {
                include '**/*.py'
                exclude '**/build/**', '**/__pycache__/**', '**/*.egg-info/**'
            },
            fileTree('tools') { include '**/*.py', '**/*.sh'; exclude '**/__pycache__/**' },
            fileTree('experiments') { include '**/*.py'; exclude '**/__pycache__/**' },
            fileTree('python/src') { include '**/*.rs' },
            files('docs/overrides/landing.html', 'src/main/javadoc/overview.html'))
    outputs.file(layout.buildDirectory.file('reports/license/software-license-headers.txt'))
    doLast {
        String blockHeader = layout.projectDirectory.file('gradle/java-license-header.txt')
                .asFile.getText('UTF-8')
        String hashHeader = layout.projectDirectory.file('gradle/hash-license-header.txt')
                .asFile.getText('UTF-8')
        String slashHeader = layout.projectDirectory.file('gradle/slash-license-header.txt')
                .asFile.getText('UTF-8')
        String htmlHeader = layout.projectDirectory.file('gradle/html-license-header.txt')
                .asFile.getText('UTF-8')
        String jinjaHeader = layout.projectDirectory.file('gradle/jinja-license-header.txt')
                .asFile.getText('UTF-8')
        List<String> classifications = []
        List<String> failures = []

        def verifyPrefix = { Collection<File> sourceFiles, String expectedHeader, String classification ->
            sourceFiles.toList().sort { File left, File right ->
                relativePath(left) <=> relativePath(right)
            }.each { File sourceFile ->
                String relative = relativePath(sourceFile)
                if (sourceFile.getText('UTF-8').startsWith(expectedHeader)) {
                    classifications.add("${classification} ${relative}")
                } else {
                    failures.add("${relative}: does not begin with ${classification}")
                }
            }
        }
        def verifyHashPrefix = { Collection<File> sourceFiles ->
            sourceFiles.toList().sort { File left, File right ->
                relativePath(left) <=> relativePath(right)
            }.each { File sourceFile ->
                String relative = relativePath(sourceFile)
                String content = sourceFile.getText('UTF-8')
                int headerOffset = content.startsWith('#!') ? content.indexOf('\n') + 1 : 0
                if (headerOffset >= 0 && content.startsWith(hashHeader, headerOffset)) {
                    classifications.add("RADIXOR_HASH_HEADER ${relative}")
                } else {
                    failures.add("${relative}: does not begin with the canonical hash-comment header")
                }
            }
        }

        List<File> blockSources = files(
                fileTree('.') { include '*.gradle' },
                fileTree('build-logic') { include '*.gradle', 'src/**/*.groovy' },
                fileTree('gradle') { include '*.gradle' },
                fileTree('models') { include '*/build.gradle' },
                fileTree('python-c/src') { include '**/*.c', '**/*.h' },
                fileTree('docs/assets') { include '**/*.css', '**/*.js' },
                fileTree('experiments') { include '**/*.java' })
                .files.toList()
        List<File> hashSources = files(
                fileTree('python') {
                    include '**/*.py'
                    exclude '**/build/**', '**/__pycache__/**', '**/*.egg-info/**'
                },
                fileTree('python-c') {
                    include '**/*.py'
                    exclude '**/build/**', '**/__pycache__/**', '**/*.egg-info/**'
                },
                fileTree('tools') { include '**/*.py', '**/*.sh'; exclude '**/__pycache__/**' },
                fileTree('experiments') { include '**/*.py'; exclude '**/__pycache__/**' })
                .files.toList()
        List<File> slashSources = fileTree('python/src') { include '**/*.rs' }
                .files.toList()
        List<File> htmlSources = files('src/main/javadoc/overview.html').files.toList()
        List<File> jinjaSources = files('docs/overrides/landing.html').files.toList()

        verifyPrefix(blockSources, blockHeader, 'RADIXOR_BLOCK_HEADER')
        verifyHashPrefix(hashSources)
        verifyPrefix(slashSources, slashHeader, 'RADIXOR_SLASH_HEADER')
        verifyPrefix(htmlSources, htmlHeader, 'RADIXOR_HTML_HEADER')
        verifyPrefix(jinjaSources, jinjaHeader, 'RADIXOR_JINJA_HEADER')

        /*
         * Model dictionaries and derived model resources are intentionally not
         * software inputs here. Their distinct licenses and provenance are
         * enforced by validateModelInput and verifyModelDescriptor.
         */
        File report = layout.buildDirectory.file('reports/license/software-license-headers.txt')
                .get().asFile
        report.parentFile.mkdirs()
        report.setText(classifications.join('\n') + '\n', 'UTF-8')
        if (!failures.isEmpty()) {
            throw new GradleException('Maintained software license verification failed: '
                    + failures.sort().join(', '))
        }
    }
}

