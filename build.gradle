tasks.register('editCostSensitivity', JavaExec) {
    group = 'verification'
    description = 'Evaluates normalized edit-cost ratios across knowledge levels and deterministic dictionary splits.'
    dependsOn(tasks.named('testClasses'))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.egothor.stemmer.benchmark.generalization.EditCostSensitivityApplication'
    final String editCostSourceState = providers.exec {
        commandLine 'git', 'status', '--porcelain'
    }.standardOutput.asText.get().trim().isEmpty() ? 'clean' : 'dirty'
    final List<Object> editCostArgs = [
            providers.gradleProperty('editCostOutput')
                    .orElse(layout.buildDirectory.file('reports/generalization/edit-cost-sensitivity.csv')
                            .map { it.asFile.absolutePath }).get(),
            dictionaryGeneralizationReleaseVersion.get(),
            providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim(),
            editCostSourceState,
            layout.projectDirectory.file('src/test/java/org/egothor/stemmer/benchmark/generalization/EditCostSensitivityApplication.java').asFile.absolutePath
    ]
    final boolean hasLanguage = project.hasProperty('editCostLanguage')
    if (project.hasProperty('editCostSeed') || hasLanguage) {
        editCostArgs.add(project.hasProperty('editCostSeed') ? project.property('editCostSeed') : 'all')
    }
    if (hasLanguage) { editCostArgs.add(project.property('editCostLanguage').toString().toUpperCase(java.util.Locale.ROOT)) }
    if (project.hasProperty('editCostConfig')) {
        if (!hasLanguage) {
            editCostArgs.add('ALL')
        }
        editCostArgs.add(project.property('editCostConfig').toString().toUpperCase(java.util.Locale.ROOT))
    }
    args editCostArgs
    maxHeapSize = '8g'
}

