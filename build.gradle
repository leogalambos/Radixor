tasks.register('writeProhibitedBenchmarkRuntimeClasspath') {
    group = 'verification'
    description = 'Writes the private runtime classpath for the guarded prohibited-model benchmark only.'
    final List<Project> prohibitedProjects = prohibitedModelProjects()
    dependsOn(tasks.named('jmhJar'))
    dependsOn(tasks.named('testClasses'))
    dependsOn(prohibitedProjects.collect { Project modelProject -> modelProject.tasks.named('jar') })
    outputs.file(layout.buildDirectory.file('prohibited-model-benchmark/runtime-classpath.txt'))
    doFirst {
        if (!prohibitedBenchmarkEnabled()) {
            throw new GradleException('writeProhibitedBenchmarkRuntimeClasspath requires '
                    + '-PradixorInternalProhibitedBenchmark=true inside the guarded runner.')
        }
    }
    doLast {
        final Set<String> prohibitedIds = quarantinedModelIds() as Set<String>
        final Set<String> activeIds = modelProjects().collect { Project modelProject -> modelProject.name } as Set<String>
        final Set<String> alternativeIds = alternativeModelProjects()
                .collect { Project modelProject -> modelProject.name } as Set<String>
        if (!prohibitedIds.intersect(activeIds + alternativeIds).isEmpty()) {
            throw new GradleException('Prohibited benchmark projects overlap a public model topology.')
        }
        final List<File> prohibitedJars = prohibitedProjects.collect { Project modelProject ->
            modelProject.tasks.named('jar', Jar).get().archiveFile.get().asFile
        }
                .sort { File left, File right -> left.name <=> right.name }
        prohibitedIds.each { String modelId ->
            final String prefix = "radixor-model-${modelId}-"
            if (prohibitedJars.count { File candidate -> candidate.name.startsWith(prefix) } != 1) {
                throw new GradleException("Private benchmark classpath must contain exactly one JAR for ${modelId}.")
            }
        }
        final File report = layout.buildDirectory.file(
                'prohibited-model-benchmark/runtime-classpath.txt').get().asFile
        report.parentFile.mkdirs()
        final File executable = tasks.named('jmhJar', Jar).get().archiveFile.get().asFile
        report.setText(executable.absolutePath + File.pathSeparator
                + sourceSets.test.runtimeClasspath.asPath + File.pathSeparator
                + sourceSets.jmh.runtimeClasspath.asPath + File.pathSeparator
                + prohibitedJars.collect { File candidate -> candidate.absolutePath }.join(File.pathSeparator)
                + System.lineSeparator(), 'UTF-8')
    }
}

tasks.register('prepareBenchmarkModelInputs', Sync) {
    group = 'verification'
    description = 'Prepares all registered language-default inputs for JMH and quality evaluation without changing source data.'
    into(layout.buildDirectory.dir('generated/benchmark-model-inputs'))
    languageDefaultModelProjects().each { Project modelProject ->
        final String modelBuildText = modelProject.file('build.gradle').getText('UTF-8')
        final java.util.regex.Matcher languageMatcher = modelBuildText =~ /(?m)^\s*language\s*=\s*'([A-Z_]+)'\s*$/
        if (!languageMatcher.find()) {
            throw new GradleException("Model ${modelProject.path} does not declare a language.")
        }
        final String languageDirectory = languageMatcher.group(1).toLowerCase(java.util.Locale.ROOT)
        from(modelProject.file('src/modelInput/stemmer.gz')) {
            into(languageDirectory)
        }
    }
}

