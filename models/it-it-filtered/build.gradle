plugins {
    id 'org.egothor.radixor.model'
}

radixorModel {
    modelId = 'it-it-filtered'
    language = 'IT_IT'
    displayName = 'Italian filtered candidate model'
    defaultModel = false
    sourceName = 'UniMorph via it-it-default'
    sourceVersion = 'not-recorded-in-legacy-import'
    sourceRevision = 'not-recorded-in-legacy-import'
    sourceProject = 'UniMorph'
    sourceRepository = 'https://github.com/unimorph/ita'
    sourceDataset = 'Checked-in it-it-default model derived from the UniMorph Italian dataset (`ita`)'
    sourceRevisionStatus = 'not-recorded-in-legacy-import'
    sourceLicense = 'CC-BY-SA-3.0'
    sourceLicenseUri = 'https://creativecommons.org/licenses/by-sa/3.0/'
    sourceAttribution = 'UniMorph and Wikipedia contributors'
    sourceVerificationDate = '2026-07-22'
    transformationsSummary = 'Radixor internal-evidence sanitation of it-it-default followed by removal of strongly dominated stem assignments and deterministic GZip packaging; no external vocabulary was used'
    noticeFileName = 'NOTICE-model-data.txt'
}
