import groovy.xml.XmlParser

plugins {
    id 'base'
    id 'maven-publish'
    id 'signing'
}

group = 'org.egothor'
version = providers.fileContents(rootProject.layout.projectDirectory.file('models/catalog-version.txt'))
        .asText.map(String::trim).get()

Properties active = new Properties()
rootProject.file('models/model-projects.properties').withInputStream { InputStream input -> active.load(input) }
Properties standard = new Properties()
rootProject.file('models/standard-model-projects.properties').withInputStream { InputStream input -> standard.load(input) }
Properties filtered = new Properties()
rootProject.file('models/alternative-model-projects.properties').withInputStream { InputStream input -> filtered.load(input) }
List<String> extendedModelIds = (active.stringPropertyNames() - standard.stringPropertyNames()).toList().sort()
if (active.size() != 144 || standard.size() != 31 || extendedModelIds.size() != 113
        || !standard.stringPropertyNames().every { String modelId -> active.containsKey(modelId) }
        || !active.stringPropertyNames().intersect(filtered.stringPropertyNames()).isEmpty()) {
    throw new GradleException('Standard, extended, and filtered model membership is inconsistent.')
}
Map<String, String> extendedModelVersions = extendedModelIds.collectEntries { String modelId ->
    final Project modelProject = project(":models:${modelId}")
    final String modelVersion = providers.gradleProperty('modelReleaseVersion')
            .orElse(providers.fileContents(modelProject.layout.projectDirectory.file('model-version.txt'))
                    .asText.map(String::trim)).get()
    [(modelId): modelVersion]
}

publishing {
    publications {
        extended(MavenPublication) {
            artifactId = 'radixor-models-extended'
            pom {
                name = 'Radixor Extended Stemmer Models'
                description = 'POM-only runtime aggregate for active non-standard models; every dependency retains its packaged data license and notice.'
                packaging = 'pom'
                url = 'https://github.com/leogalambos/Radixor'
                licenses {
                    license {
                        name = 'BSD-3-Clause'
                        url = 'https://spdx.org/licenses/BSD-3-Clause.html'
                        distribution = 'repo'
                    }
                }
            }
            pom.withXml {
                Node dependenciesNode = asNode().appendNode('dependencies')
                extendedModelIds.each { String modelId ->
                    Node dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', 'org.egothor')
                    dependencyNode.appendNode('artifactId', "radixor-model-${modelId}")
                    dependencyNode.appendNode('version', extendedModelVersions.get(modelId))
                    dependencyNode.appendNode('scope', 'runtime')
                }
            }
        }
    }
    repositories {
        maven {
            name = 'catalogStaging'
            url = rootProject.layout.buildDirectory.dir('model-catalog-staging-repository').get().asFile.toURI()
        }
    }
}

String signingKey = providers.environmentVariable('SIGNING_KEY').orNull
String signingPassword = providers.environmentVariable('SIGNING_PASSWORD').orNull
signing {
    required = { providers.environmentVariable('GITHUB_REF_TYPE').orNull == 'tag' }
    if (signingKey != null && !signingKey.isBlank()) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.extended
    }
}

tasks.register('verifyPomOnlyAggregate') {
    group = 'verification'
    dependsOn(tasks.named('generatePomFileForExtendedPublication'))
    doLast {
        Node pom = new XmlParser().parse(layout.buildDirectory.file('publications/extended/pom-default.xml').get().asFile)
        List<Node> dependencies = pom.dependencies.dependency as List<Node>
        List<String> artifactIds = dependencies.collect { Node dependency -> dependency.artifactId.text() }
        List<String> expected = extendedModelIds.collect { String modelId -> "radixor-model-${modelId}" }
        if (pom.packaging.text() != 'pom' || artifactIds != expected
                || dependencies.any { Node dependency -> dependency.scope.text() != 'runtime' }
                || !tasks.withType(Jar).isEmpty()) {
            throw new GradleException('radixor-models-extended must be a POM-only aggregate of exactly 113 active non-standard models.')
        }
    }
}

tasks.named('check') { dependsOn(tasks.named('verifyPomOnlyAggregate')) }
