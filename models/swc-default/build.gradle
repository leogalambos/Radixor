plugins {
    id 'org.egothor.radixor.model'
}

radixorModel {
    modelId = 'swc-default'
    language = 'SWC'
    displayName = 'Congo Swahili — UniMorph'
    defaultModel = true
    manifestManaged = true
    sourceName = 'UniMorph'
    sourceVersion = '02a2bdec0e5cb0dc93b6ef11db4d54a82c34b224'
    sourceRevision = '02a2bdec0e5cb0dc93b6ef11db4d54a82c34b224'
    sourceProject = 'UniMorph'
    sourceRepository = 'https://github.com/unimorph/swc'
    sourceDataset = 'UniMorph Congo Swahili morphological dataset (`swc`)'
    sourceRevisionStatus = 'recorded'
    sourceLicense = 'CC-BY-SA-3.0'
    sourceLicenseUri = 'https://creativecommons.org/licenses/by-sa/3.0/'
    sourceAttribution = 'UniMorph; Jennifer White'
    sourceVerificationDate = '2026-09-11'
    transformationsSummary = 'Strict UTF-8 validation, NFC normalization, lowercase conversion, structural unsafe-character rejection, grouping by lemma, exact deduplication, deterministic ordering, and reproducible GZip packaging'
    noticeFileName = 'NOTICE-model-data.txt'
}
