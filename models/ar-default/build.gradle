plugins {
    id 'org.egothor.radixor.model'
}

radixorModel {
    modelId = 'ar-default'
    language = 'AR'
    displayName = 'Arabic — UniMorph'
    defaultModel = true
    rightToLeft = true
    sourceName = 'UniMorph'
    sourceVersion = 'e9b7521ab75e3a7da6f996a428031164993e6f19'
    sourceRevision = 'e9b7521ab75e3a7da6f996a428031164993e6f19'
    sourceProject = 'UniMorph'
    sourceRepository = 'https://github.com/unimorph/ara'
    sourceDataset = 'UniMorph Arabic morphological datasets `ara_atb` and `ara_new`'
    sourceRevisionStatus = 'recorded'
    sourceLicense = 'CC-BY-SA-3.0'
    sourceLicenseUri = 'https://creativecommons.org/licenses/by-sa/3.0/'
    sourceAttribution = 'UniMorph; Salam Khalifa and Nizar Habash (CAMeL Lab @ NYU Abu Dhabi)'
    sourceVerificationDate = '2026-09-10'
    transformationsSummary = 'Pinned-source verification, NFC normalization, filtering to Unicode letters, numbers, and combining marks, grouping inflected forms by lemma, exact deduplication, deterministic GZip packaging, and generation of runtime descriptor and checksum metadata'
    noticeFileName = 'NOTICE-model-data.txt'
}
